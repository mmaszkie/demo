apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-environment-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-environment-app
  template:
    metadata:
      labels:
        app: student-environment-app
    spec:
      containers:
        - name: app
          image: student-environment-check:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_MONGODB_URI
              value: mongodb://mongo:27017/student_environment
          readinessProbe:
            httpGet:
              path: /api/notes
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: student-environment-app
spec:
  selector:
    app: student-environment-app
  ports:
    - port: 8080
      targetPort: 8080
